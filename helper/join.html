<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANGHO Detector</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="seaf-helper-body">
  <main class="seaf-helper-shell">
    <section class="seaf-helper-card">
      <h1 class="seaf-helper-title">MANGHO Detector</h1>
      <p class="seaf-helper-message">
        Steam 참가를 시도합니다. 반응이 없으면 아래 버튼으로 모집 글을 직접 열어 확인할 수 있습니다.
      </p>
      <p class="seaf-helper-status" id="seaf-helper-status">참가 링크를 준비하는 중입니다...</p>
      <div class="seaf-helper-actions">
        <button type="button" class="seaf-action-button" id="seaf-helper-launch-button">
          Steam 다시 시도
        </button>
        <button type="button" class="seaf-secondary-button" id="seaf-helper-open-post-button">
          게시글 열기
        </button>
      </div>
    </section>
  </main>

  <script src="join.js"></script>
</body>
</html>
